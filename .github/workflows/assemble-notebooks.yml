name: Assemble notebooks

on:
  push:
    paths:
      - ".staging/ASSEMBLE"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble notebook archive
        shell: bash
        run: |
          cat .staging/notebooks.tar.gz.b64.part* > /tmp/notebooks.b64
          base64 --decode /tmp/notebooks.b64 > /tmp/notebooks.tar.gz
          tar -xzf /tmp/notebooks.tar.gz
          rm -rf .staging
          rm -f .github/workflows/assemble-notebooks.yml

      - name: Commit notebooks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add cleaned experiment notebooks"
          git push
